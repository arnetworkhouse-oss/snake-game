<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake Pro Elite</title>
<link rel="icon" href="https://raw.githubusercontent.com/arnetworkhouse-oss/snake-game/main/snake.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --cyan:#00f2ff;
  --pink:#ff0055;
  --bg:#020205;
  --glass:rgba(255,255,255,0.05);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle,#1a1a2e,#020205);
  font-family:'Rajdhani',sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  overflow:hidden;
}

/* LOADER */
#loader{
  position:fixed;
  inset:0;
  background:#020205;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:2000;
}

#loader h1{
  font-family:'Orbitron';
  color:var(--cyan);
  letter-spacing:4px;
  margin-bottom:30px;
}

.loader-bar{
  width:260px;
  height:10px;
  border:1px solid #333;
  border-radius:20px;
  overflow:hidden;
}

.loader-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--cyan),#0066ff);
  transition:width 0.1s linear;
}

#loader p{margin-top:20px;font-size:12px;color:#777;}

/* SETUP */
#game-setup{
  position:fixed;
  inset:0;
  background:rgba(2,2,5,0.95);
  backdrop-filter:blur(15px);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.setup-card{
  background:var(--glass);
  border:1px solid rgba(0,242,255,0.2);
  border-radius:20px;
  padding:30px;
  width:90%;
  max-width:350px;
  text-align:center;
}

h2{font-family:'Orbitron';color:var(--cyan);margin-bottom:20px;}

input,select,button{
  width:100%;
  padding:14px;
  margin:10px 0;
  background:#000;
  border:1px solid #333;
  color:#fff;
  border-radius:8px;
  font-family:'Orbitron';
  font-size:14px;
}

button{
  background:linear-gradient(45deg,var(--cyan),#0066ff);
  color:#000;
  font-weight:bold;
  cursor:pointer;
  border:none;
  transition:opacity 0.15s;
}
button:active{opacity:0.7;}

/* GAME */
.game-layout{display:none;flex-direction:column;align-items:center;gap:12px;}

.status-pane{display:flex;gap:10px;}

.stat-box{
  background:var(--glass);
  border-left:3px solid var(--cyan);
  padding:10px 15px;
  border-radius:8px;
  text-align:center;
  min-width:100px;
}

.label{font-size:10px;color:#888;text-transform:uppercase;}
.value{font-family:'Orbitron';font-size:18px;}

.canvas-wrapper{
  position:relative;
  width:90vw;
  height:90vw;
  max-width:400px;
  max-height:400px;
  background:#000;
  border:2px solid #1a1a3a;
  border-radius:10px;
  box-shadow:0 0 30px rgba(0,242,255,0.08);
  overflow:hidden;
}

canvas{width:100%;height:100%;display:block;}

/* CONTROLS */
.controller{
  margin-top:8px;
  display:grid;
  grid-template-areas:". up ." "left down right";
  gap:10px;
}

.control-btn{
  width:62px;
  height:62px;
  border-radius:50%;
  border:1px solid #333;
  background:rgba(0,242,255,0.06);
  color:var(--cyan);
  font-size:22px;
  cursor:pointer;
  transition:background 0.1s;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
}
.control-btn:active{background:rgba(0,242,255,0.2);}

.up{grid-area:up;}
.left{grid-area:left;}
.down{grid-area:down;}
.right{grid-area:right;}

/* GAME OVER */
#game-over{
  position:fixed;
  inset:0;
  background:rgba(2,2,5,0.95);
  backdrop-filter:blur(10px);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:1500;
}

.over-card{
  background:var(--glass);
  padding:30px;
  border-radius:20px;
  text-align:center;
  width:90%;
  max-width:320px;
  border:1px solid rgba(255,0,85,0.3);
}

.over-card h2{color:var(--pink);font-family:'Orbitron';}
.over-card h1{font-family:'Orbitron';color:var(--cyan);font-size:48px;margin:10px 0;}
.over-card button{margin-top:8px;}

.global-footer{
  margin-top:20px;
  text-align:center;
  font-size:0.75rem;
  opacity:0.6;
  line-height:1.8;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <h1>SNAKE PRO</h1>
  <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
  <p>MADE BY AR Network House</p>
</div>

<!-- SETUP -->
<div id="game-setup">
  <div class="setup-card">
    <h2>MISSION SETUP</h2>
    <input id="playerName" placeholder="CODENAME">
    <select id="speedLevel">
      <option value="1">LEVEL 01 — RECRUIT</option>
      <option value="3">LEVEL 03 — AGENT</option>
      <option value="6">LEVEL 06 — ELITE</option>
      <option value="10">LEVEL 10 — LEGEND</option>
    </select>
    <button id="startBtn">START MISSION</button>
  </div>
</div>

<!-- GAME -->
<div class="game-layout" id="gameArea">
  <div class="status-pane">
    <div class="stat-box"><div class="label">Agent</div><div class="value" id="display-name">---</div></div>
    <div class="stat-box"><div class="label">Score</div><div class="value" id="display-score">000</div></div>
  </div>
  <div class="canvas-wrapper">
    <canvas id="snakeGame" width="400" height="400"></canvas>
  </div>
</div>

<!-- CONTROLLER -->
<div class="controller">
  <button class="control-btn up" id="btn-up">▲</button>
  <button class="control-btn left" id="btn-left">◀</button>
  <button class="control-btn down" id="btn-down">▼</button>
  <button class="control-btn right" id="btn-right">▶</button>
</div>

<footer class="global-footer">
  <p>Game maintained by <a href="https://arnetworkhouse.in/" target="_blank" style="color:#78d7ff;text-decoration:underline;">AR NETWORK HOUSE</a></p>
  <p><a href="https://arnetworkhouse-oss.github.io/ar-network-house/more.html" target="_blank" style="color:#78d7ff;text-decoration:underline;">MORE GAMES</a> &nbsp;|&nbsp; <a href="https://arnetworkhouse-oss.github.io/snake-game/feedback_snake_game.html" target="_blank" style="color:#78d7ff;text-decoration:underline;">RATE US</a></p>
</footer>

<!-- GAME OVER -->
<div id="game-over">
  <div class="over-card">
    <h2>MISSION FAILED</h2>
    <p>Your Score</p>
    <h1 id="finalScore">000</h1>
    <button onclick="retryGame()">RETRY</button>
    <button onclick="goHome()">HOME</button>
    <button onclick="window.open('https://arnetworkhouse.in/more.html','_blank')">MORE GAMES</button>
    <button onclick="window.open('https://arnetworkhouse-oss.github.io/snake-game/feedback_snake_game.html','_blank')">RATE US</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  /* ===== KEYBOARD ===== */
  document.addEventListener("keydown", (e) => {
    const map = {
      "ARROWLEFT":"LEFT","A":"LEFT",
      "ARROWRIGHT":"RIGHT","D":"RIGHT",
      "ARROWUP":"UP","W":"UP",
      "ARROWDOWN":"DOWN","S":"DOWN"
    };
    const dir = map[e.key.toUpperCase()];
    if(dir){ e.preventDefault(); window.changeDir(dir); }
  });

  /* ===== TOUCH BUTTONS — no delay ===== */
  const btnMap = {
    "btn-up":"UP","btn-left":"LEFT",
    "btn-down":"DOWN","btn-right":"RIGHT"
  };
  Object.entries(btnMap).forEach(([id,dir]) => {
    const btn = document.getElementById(id);
    btn.addEventListener("touchstart",(e)=>{ e.preventDefault(); window.changeDir(dir); },{passive:false});
    btn.addEventListener("mousedown",(e)=>{ e.preventDefault(); window.changeDir(dir); });
  });

  const canvas = document.getElementById("snakeGame");
  const ctx = canvas.getContext("2d");
  const box = 20;
  const COLS = 20, ROWS = 20;

  let snake, food, d, nextD, score, interval, speed, points;

  /* ===== SPEED MAP ===== */
  const speedMap = { 1:200, 3:150, 6:110, 10:70 };

  /* ===== LOADER ===== */
  let load = 0;
  const loaderFill = document.getElementById("loaderFill");
  const loader = document.getElementById("loader");
  const setup = document.getElementById("game-setup");

  const loaderInt = setInterval(() => {
    load++;
    loaderFill.style.width = load + "%";
    if(load >= 100){
      clearInterval(loaderInt);
      loader.style.display = "none";
      setup.style.display = "flex";
    }
  }, 20);

  /* ===== START ===== */
  document.getElementById("startBtn").onclick = () => {
    setup.style.display = "none";
    document.getElementById("gameArea").style.display = "flex";
    document.getElementById("display-name").innerText =
      (document.getElementById("playerName").value || "AGENT").toUpperCase();

    points = parseInt(document.getElementById("speedLevel").value);
    speed = speedMap[points] || 200;
    startGame();
  };

  function startGame(){
    snake = [{x:10*box,y:10*box},{x:9*box,y:10*box},{x:8*box,y:10*box}];
    food = randFood();
    d = nextD = "RIGHT";
    score = 0;
    updateUI();
    clearInterval(interval);
    interval = setInterval(draw, speed);
  }

  function randFood(){
    let pos;
    do {
      pos = {x:Math.floor(Math.random()*COLS)*box, y:Math.floor(Math.random()*ROWS)*box};
    } while(snake && snake.some(p=>p.x===pos.x&&p.y===pos.y));
    return pos;
  }

  function updateUI(){
    document.getElementById("display-score").innerText =
      score.toString().padStart(3,"0");
  }

  window.changeDir = function(dir){
    if(dir==="LEFT"  && d!=="RIGHT") nextD="LEFT";
    if(dir==="RIGHT" && d!=="LEFT")  nextD="RIGHT";
    if(dir==="UP"    && d!=="DOWN")  nextD="UP";
    if(dir==="DOWN"  && d!=="UP")    nextD="DOWN";
  };

  /* ===== DRAW ===== */
  function draw(){
    d = nextD;

    /* background */
    ctx.fillStyle = "#020205";
    ctx.fillRect(0,0,400,400);

    /* subtle grid */
    ctx.strokeStyle = "rgba(255,255,255,0.025)";
    ctx.lineWidth = 0.5;
    for(let i=0;i<=COLS;i++){
      ctx.beginPath();ctx.moveTo(i*box,0);ctx.lineTo(i*box,400);ctx.stroke();
    }
    for(let j=0;j<=ROWS;j++){
      ctx.beginPath();ctx.moveTo(0,j*box);ctx.lineTo(400,j*box);ctx.stroke();
    }

    /* food — pulsing glowing orb */
    const fx = food.x + box/2, fy = food.y + box/2;
    const grad = ctx.createRadialGradient(fx,fy,1,fx,fy,9);
    grad.addColorStop(0,"#ff4488");
    grad.addColorStop(0.5,"#ff0055");
    grad.addColorStop(1,"rgba(255,0,85,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(fx,fy,9,0,Math.PI*2);
    ctx.fill();
    /* food shine */
    ctx.fillStyle="rgba(255,255,255,0.5)";
    ctx.beginPath();
    ctx.arc(fx-2.5,fy-2.5,2.5,0,Math.PI*2);
    ctx.fill();

    /* snake body — realistic segments */
    const len = snake.length;
    for(let i = len-1; i >= 0; i--){
      const seg = snake[i];
      const cx = seg.x + box/2;
      const cy = seg.y + box/2;
      const r = i===0 ? 8 : 7;
      const alpha = i===0 ? 1 : Math.max(0.35, 1 - (i/len)*0.6);

      if(i === 0){
        /* HEAD — brighter + eyes */
        const hg = ctx.createRadialGradient(cx-2,cy-2,1,cx,cy,r);
        hg.addColorStop(0,"#80ffff");
        hg.addColorStop(0.5,"#00f2ff");
        hg.addColorStop(1,"#0088aa");
        ctx.fillStyle = hg;
        ctx.beginPath();
        ctx.roundRect(seg.x+1,seg.y+1,box-2,box-2,5);
        ctx.fill();

        /* eyes based on direction */
        ctx.fillStyle = "#001a1a";
        let e1x,e1y,e2x,e2y;
        const eo = 5;
        if(d==="RIGHT"){e1x=seg.x+13;e1y=seg.y+5;  e2x=seg.x+13;e2y=seg.y+13;}
        else if(d==="LEFT"){e1x=seg.x+5;e1y=seg.y+5;e2x=seg.x+5;e2y=seg.y+13;}
        else if(d==="UP"){e1x=seg.x+5;e1y=seg.y+5;  e2x=seg.x+13;e2y=seg.y+5;}
        else{e1x=seg.x+5;e1y=seg.y+13;              e2x=seg.x+13;e2y=seg.y+13;}
        ctx.beginPath();ctx.arc(e1x,e1y,2.5,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(e2x,e2y,2.5,0,Math.PI*2);ctx.fill();
        /* eye shine */
        ctx.fillStyle="rgba(255,255,255,0.7)";
        ctx.beginPath();ctx.arc(e1x+0.8,e1y-0.8,1,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(e2x+0.8,e2y-0.8,1,0,Math.PI*2);ctx.fill();

      } else {
        /* BODY — scale-like gradient */
        const t = i/len;
        /* interpolate cyan → green */
        const R = Math.round(0 + t*0);
        const G = Math.round(242 - t*80);
        const B = Math.round(255 - t*60);
        const bg = ctx.createRadialGradient(cx-1,cy-1,1,cx,cy,r);
        bg.addColorStop(0,`rgba(${R},${G+40},${B},${alpha})`);
        bg.addColorStop(1,`rgba(${R},${G},${B},${alpha*0.6})`);
        ctx.fillStyle = bg;
        const rr = i === len-1 ? 6 : 4; /* tail more rounded */
        ctx.beginPath();
        ctx.roundRect(seg.x+2,seg.y+2,box-4,box-4,rr);
        ctx.fill();
        /* scale highlight */
        ctx.fillStyle=`rgba(255,255,255,${alpha*0.15})`;
        ctx.beginPath();
        ctx.ellipse(cx-1,cy-1,3,2,0,0,Math.PI*2);
        ctx.fill();
      }
    }

    /* MOVE */
    let x = snake[0].x;
    let y = snake[0].y;
    if(d==="LEFT")  x -= box;
    if(d==="RIGHT") x += box;
    if(d==="UP")    y -= box;
    if(d==="DOWN")  y += box;

    /* wrap */
    if(x<0)    x=380; if(x>=400) x=0;
    if(y<0)    y=380; if(y>=400) y=0;

    /* eat */
    if(x===food.x && y===food.y){
      score += points;
      updateUI();
      food = randFood();
    } else {
      snake.pop();
    }

    /* self collision */
    if(snake.some(p=>p.x===x&&p.y===y)){
      endGame(); return;
    }

    snake.unshift({x,y});
  }

  function endGame(){
    clearInterval(interval);
    document.getElementById("finalScore").innerText = score;
    document.getElementById("game-over").style.display = "flex";
  }

  window.retryGame = function(){
    document.getElementById("game-over").style.display = "none";
    startGame();
  };

  window.goHome = function(){
    document.getElementById("game-over").style.display = "none";
    document.getElementById("gameArea").style.display = "none";
    setup.style.display = "flex";
  };

});
</script>
</body>
</html>
